<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo cliente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.campo{position:relative}
.campo input{box-sizing:border-box;width:100%;height:56px;padding:0 16px;border:1px solid #3A3D44;border-radius:12px;background:transparent;color:#F5F5F5;font:500 16px Inter,sans-serif;outline:none}
.campo input::placeholder{color:#8A8E96}
.campo label{position:absolute;top:-9px;left:12px;padding:0 6px;font:500 12px Inter,sans-serif;line-height:16px;color:#A1A1AA;background:#0F1012}
.campo.error input{border-color:#FF6B6B}
.campo.error label{color:#FF6B6B}
.ayuda{margin:6px 4px 0;font-size:12px;line-height:16px;color:#A1A1AA;display:flex;gap:6px;align-items:flex-start}
.ayuda.error{color:#FF6B6B}
.ayuda svg{flex-shrink:0;margin-top:1px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; opacity: 0.35">
    <div style="font-size: 18px; font-weight: 600">Elegir cliente</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="titulo" style="position: absolute; left: 0; right: 0; bottom: 0; top: 330px; background: #0F1012; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 22px">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #3A3D44"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -8px">
      <h2 id="titulo" style="margin: 0; font-size: 18px; font-weight: 600">Nuevo cliente</h2>
      <button type="button" style="height: 44px; padding: 0 8px; margin-right: -8px; border: 0; background: transparent; color: #5EC8F2; font: 600 15px Inter, sans-serif">Cancelar</button>
    </div>

    <div>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" value="Pedro Martínez" maxlength="80">
      </div>
      <p class="ayuda">Hasta 80 caracteres</p>
    </div>

    <div>
      <div class="campo error">
        <label for="celular">Celular (opcional)</label>
        <input id="celular" type="tel" inputmode="numeric" value="312456" aria-invalid="true" aria-describedby="err-celular">
      </div>
      <p class="ayuda error" id="err-celular"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>El celular debe tener 10 dígitos y empezar por 3</p>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <button type="button" disabled aria-disabled="true" aria-describedby="m-guardar" style="height: 52px; border: 0; border-radius: 14px; background: #1F2125; color: #8A8E96; font: 600 15px Inter, sans-serif">Guardar cliente</button>
      <p class="ayuda" id="m-guardar" style="justify-content: center">Corrige los campos marcados para continuar</p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
