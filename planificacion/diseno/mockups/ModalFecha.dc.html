<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fecha de la venta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.dia{width:44px;height:44px;border:0;border-radius:999px;font:500 15px Inter,sans-serif;justify-self:center}
.ayuda{margin:0 4px;font-size:12px;line-height:16px;color:#A1A1AA}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; opacity: 0.35">
    <div style="font-size: 28px; font-weight: 700">Vender</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="titulo" style="position: absolute; left: 0; right: 0; bottom: 0; top: 214px; background: #0F1012; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #3A3D44"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -8px">
      <h2 id="titulo" style="margin: 0; font-size: 18px; font-weight: 600">Fecha de la venta</h2>
      <button type="button" style="height: 44px; padding: 0 8px; margin-right: -8px; border: 0; background: transparent; color: #5EC8F2; font: 600 15px Inter, sans-serif">Listo</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 600">noviembre de 2026</span>
      <div style="display: flex; gap: 4px">
        <button type="button" aria-label="Mes anterior" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #17181B; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <button type="button" disabled aria-disabled="true" aria-label="Mes siguiente" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #17181B; opacity: 0.4; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>

    <div role="grid" aria-label="noviembre de 2026" style="display: flex; flex-direction: column; gap: 4px">
      <div role="row" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12px; font-weight: 600; color: #A1A1AA; text-align: center; padding-bottom: 4px">
        <span role="columnheader" aria-label="domingo">D</span><span role="columnheader" aria-label="lunes">L</span><span role="columnheader" aria-label="martes">M</span><span role="columnheader" aria-label="miércoles">M</span><span role="columnheader" aria-label="jueves">J</span><span role="columnheader" aria-label="viernes">V</span><span role="columnheader" aria-label="sábado">S</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
        <sc-for list="{{dias}}" as="d" hint-placeholder-count="30">
          <button type="button" class="dia" disabled="{{d.deshabilitado}}" aria-disabled="{{d.ariaDeshabilitado}}" aria-pressed="{{d.ariaSeleccionado}}" style="{{d.estilo}}">{{d.n}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid #1F2125">
      <span id="lbl-hora" style="font-size: 14px; color: #A1A1AA">Hora</span>
      <button type="button" aria-labelledby="lbl-hora hora" id="hora" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #17181B; color: #F5F5F5; font: 600 15px Inter, sans-serif">3:45 p. m.</button>
    </div>
    <p class="ayuda">No puede ser una fecha futura ni anterior a la compra del lote.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hoy = 16;
    const dias = [];
    for (let n = 1; n <= 30; n++) {
      const futuro = n > hoy;
      const seleccionado = n === hoy;
      let estilo = 'background: transparent; color: #F5F5F5';
      if (futuro) estilo = 'background: transparent; color: #4A4D54';
      if (seleccionado) estilo = 'background: #CBFF3D; color: #0A0A0A; font-weight: 700';
      dias.push({
        n: n,
        deshabilitado: futuro,
        ariaDeshabilitado: futuro ? 'true' : 'false',
        ariaSeleccionado: seleccionado ? 'true' : 'false',
        estilo: estilo
      });
    }
    return { dias: dias };
  }
}
</script>
</body>
</html>
