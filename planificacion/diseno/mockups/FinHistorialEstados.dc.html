<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historial de retiros · estados</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.etiqueta-estado{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#8A8E96}
.tarjeta{background:#0F1012;border:1px solid #1F2125;border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.esqueleto{display:flex;align-items:center;gap:12px;padding:6px 0}
.esqueleto .c{width:40px;height:40px;border-radius:999px;background:#1F2125}
.esqueleto .b{height:10px;border-radius:999px;background:#1F2125}
.btn-p{height:48px;border:0;border-radius:14px;background:#CBFF3D;color:#0A0A0A;font:600 14px Inter,sans-serif}
.btn-t{height:44px;border:0;background:transparent;color:#5EC8F2;font:600 14px Inter,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 920px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 28px">
  <header style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Historial de retiros · estados</h1>
    <p style="margin: 0; font-size: 13px; color: #A1A1AA">Mismo patrón que la lista de clientes.</p>
  </header>

  <div>
    <p class="etiqueta-estado">Cargando</p>
    <div class="tarjeta" aria-busy="true" aria-label="Cargando retiros">
      <div class="esqueleto"><div class="c"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><div class="b" style="width: 55%"></div><div class="b" style="width: 40%"></div></div><div class="b" style="width: 70px"></div></div>
      <div class="esqueleto"><div class="c"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px"><div class="b" style="width: 45%"></div><div class="b" style="width: 50%"></div></div><div class="b" style="width: 60px"></div></div>
    </div>
  </div>

  <div>
    <p class="etiqueta-estado">Mes sin retiros (texto propuesto)</p>
    <div class="tarjeta">
      <div style="padding: 14px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
        <p style="margin: 0; font-size: 14px; font-weight: 600">No hay retiros en octubre de 2026</p>
        <p style="margin: 0; font-size: 13px; color: #A1A1AA">Los retiros que registres aparecerán aquí.</p>
      </div>
    </div>
  </div>

  <div>
    <p class="etiqueta-estado">Error de carga</p>
    <div class="tarjeta" role="alert">
      <div style="padding: 10px 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <p style="margin: 0; font-size: 14px; font-weight: 600">Ocurrió un error inesperado</p>
        <p style="margin: 0; font-size: 13px; color: #A1A1AA">No pudimos cargar los retiros.</p>
      </div>
      <button type="button" class="btn-p">Reintentar</button>
      <button type="button" class="btn-t">Cerrar</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
