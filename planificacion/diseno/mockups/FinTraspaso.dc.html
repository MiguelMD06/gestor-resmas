<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traspasar entre bolsillos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.campo{position:relative}
.campo input,.campo .selector{box-sizing:border-box;width:100%;height:56px;padding:0 16px;border:1px solid #3A3D44;border-radius:12px;background:transparent;color:#F5F5F5;font:500 16px Inter,sans-serif;outline:none}
.campo .selector{display:flex;align-items:center;gap:12px;text-align:left}
.campo label{position:absolute;top:-9px;left:12px;padding:0 6px;font:500 12px Inter,sans-serif;line-height:16px;color:#A1A1AA;background:#0F1012}
.ayuda{margin:6px 4px 0;font-size:12px;line-height:16px;color:#A1A1AA}
.btn-p{height:52px;border:0;border-radius:14px;background:#CBFF3D;color:#0A0A0A;font:600 15px Inter,sans-serif}
.btn-t{height:44px;padding:0 8px;margin-right:-8px;border:0;background:transparent;color:#5EC8F2;font:600 15px Inter,sans-serif}
.asa{align-self:center;width:36px;height:4px;border-radius:999px;background:#3A3D44}
.hoja{position:absolute;left:0;right:0;bottom:0;background:#0F1012;border-radius:24px 24px 0 0;padding:10px 20px 28px;display:flex;flex-direction:column;gap:20px}
.cab{display:flex;justify-content:space-between;align-items:center;margin-top:-8px}
.cab h2{margin:0;font-size:18px;font-weight:600}
.bolsillo{background:#17181B;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; opacity: 0.35"><div style="font-size: 28px; font-weight: 700">Finanzas</div></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section class="hoja" role="dialog" aria-modal="true" aria-labelledby="titulo" style="top: 170px">
    <div class="asa" aria-hidden="true"></div>
    <div class="cab"><h2 id="titulo">Traspasar entre bolsillos</h2><button type="button" class="btn-t">Cancelar</button></div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); gap: 8px; align-items: center">
      <div class="bolsillo">
        <span style="font-size: 12px; color: #A1A1AA">De</span>
        <span style="font-size: 15px; font-weight: 600">Efectivo</span>
        <span style="font-size: 12px; color: #A1A1AA">$ 912.000</span>
      </div>
      <button type="button" aria-label="Intercambiar origen y destino" style="width: 44px; height: 44px; border: 1px solid #2A2C31; border-radius: 999px; background: #0F1012; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>
      </button>
      <div class="bolsillo">
        <span style="font-size: 12px; color: #A1A1AA">A</span>
        <span style="font-size: 15px; font-weight: 600">Transferencia</span>
        <span style="font-size: 12px; color: #A1A1AA">$ 512.000</span>
      </div>
    </div>

    <div>
      <div class="campo"><label for="monto">Monto a traspasar</label><input id="monto" type="text" inputmode="numeric" value="$ 200.000"></div>
      <p class="ayuda">Hasta $ 912.000</p>
    </div>

    <div class="campo">
      <label for="fecha">Fecha</label>
      <button id="fecha" type="button" class="selector">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="flex-grow: 1">16 nov 2026 · 4:10 p. m.</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="padding-top: 14px; border-top: 1px solid #1F2125; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #A1A1AA">Así quedarán tus bolsillos</span>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Efectivo</span><span style="font-weight: 600">$ 712.000</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Transferencia</span><span style="font-weight: 600">$ 712.000</span></div>
      <p style="margin: 2px 0 0; font-size: 12px; color: #A1A1AA; display: flex; gap: 6px; align-items: flex-start">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
        No cambia tu capital ni tu ganancia, solo dónde está el dinero.
      </p>
    </div>

    <button type="button" class="btn-p" style="margin-top: auto">Traspasar $ 200.000</button>
  </section>
</div>
</x-dc>

</html>
