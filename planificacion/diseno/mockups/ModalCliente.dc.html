<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir cliente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.campo{position:relative}
.campo input{box-sizing:border-box;width:100%;height:56px;padding:0 16px 0 46px;border:1px solid #3A3D44;border-radius:12px;background:transparent;color:#F5F5F5;font:500 16px Inter,sans-serif;outline:none}
.campo input::placeholder{color:#8A8E96}
.campo label{position:absolute;top:-9px;left:12px;padding:0 6px;font:500 12px Inter,sans-serif;line-height:16px;color:#A1A1AA;background:#0F1012}
.fila{min-height:64px;padding:10px 4px;border:0;border-bottom:1px solid #1F2125;background:transparent;color:#F5F5F5;font-family:Inter,sans-serif;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.avatar{width:40px;height:40px;border-radius:999px;background:#17181B;color:#5EC8F2;font:600 14px Inter,sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; opacity: 0.35">
    <div style="font-size: 28px; font-weight: 700">Vender</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="titulo" style="position: absolute; left: 0; right: 0; bottom: 0; top: 52px; background: #0F1012; border-radius: 24px 24px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #3A3D44"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="titulo" style="margin: 0; font-size: 18px; font-weight: 600">Elegir cliente</h2>
      <button type="button" style="height: 44px; padding: 0 8px; margin-right: -8px; border: 0; background: transparent; color: #5EC8F2; font: 600 15px Inter, sans-serif">Cerrar</button>
    </div>

    <div class="campo">
      <label for="buscar">Buscar cliente</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 19px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="buscar" type="search" placeholder="Buscar por nombre o celular">
    </div>

    <button type="button" style="height: 48px; border: 1px solid #5EC8F2; border-radius: 14px; background: transparent; color: #5EC8F2; font: 600 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Nuevo cliente
    </button>

    <div role="list" aria-label="Clientes" style="display: flex; flex-direction: column">
      <div role="listitem"><button type="button" class="fila">
        <span class="avatar" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EC8F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9h18v2a3 3 0 01-6 0 3 3 0 01-6 0 3 3 0 01-6 0V9zM5 13v8h14v-8"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Mostrador</span>
          <span style="font-size: 12px; color: #A1A1AA">Venta rápida · solo contado</span>
        </span>
      </button></div>
      <div role="listitem"><button type="button" class="fila" aria-current="true">
        <span class="avatar" aria-hidden="true">MG</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">María Gómez</span>
          <span style="font-size: 12px; color: #A1A1AA">3001234567</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CBFF3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Seleccionado"><path d="M5 12l5 5L20 7"></path></svg>
      </button></div>
      <div role="listitem"><button type="button" class="fila">
        <span class="avatar" aria-hidden="true">JP</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Juan Pérez</span>
          <span style="font-size: 12px; color: #A1A1AA">3157654321</span>
        </span>
      </button></div>
      <div role="listitem"><button type="button" class="fila">
        <span class="avatar" aria-hidden="true">AR</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Ana Ruiz</span>
        </span>
      </button></div>
      <div role="listitem"><button type="button" class="fila">
        <span class="avatar" aria-hidden="true">CD</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Carlos Díaz</span>
          <span style="font-size: 12px; color: #A1A1AA">3205550101</span>
        </span>
      </button></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
