<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resumen de venta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#5EC8F2}a:hover{color:#8FDBF7}
.dato{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.dato dt{color:#A1A1AA}
.dato dd{margin:0;font-weight:600;text-align:right}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F5; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 28px 20px; opacity: 0.35">
    <div style="font-size: 28px; font-weight: 700">Vender</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="titulo" style="position: absolute; left: 0; right: 0; bottom: 0; top: 200px; background: #0F1012; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 20px">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #3A3D44"></div>
    <h2 id="titulo" style="margin: -6px 0 0; font-size: 18px; font-weight: 600">Resumen de venta</h2>

    <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="dato"><dt>Cliente</dt><dd>María Gómez</dd></div>
      <div class="dato"><dt>Fecha</dt><dd>16 nov 2026 · 3:45 p. m.</dd></div>
    </dl>

    <div role="list" aria-label="Productos" style="background: #17181B; border-radius: 14px; padding: 4px 14px">
      <div role="listitem" style="min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 600">5 × Carta</span>
          <span style="font-size: 12px; color: #A1A1AA">a $ 22.000 c/u</span>
        </span>
        <span style="font-size: 14px; font-weight: 600">$ 110.000</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; color: #A1A1AA">Total</span>
      <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">$ 110.000</span>
    </div>

    <dl style="margin: 0; padding-top: 14px; border-top: 1px solid #1F2125; display: flex; flex-direction: column; gap: 12px">
      <div class="dato"><dt>Pago</dt><dd>Abono inicial de $ 50.000 · Efectivo</dd></div>
      <div class="dato"><dt>Queda debiendo</dt><dd>$ 60.000</dd></div>
    </dl>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #CBFF3D; color: #0A0A0A; font: 600 15px Inter, sans-serif">Aceptar</button>
      <button type="button" style="height: 48px; border: 1px solid #5EC8F2; border-radius: 14px; background: transparent; color: #5EC8F2; font: 600 14px Inter, sans-serif">Volver a editar</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
